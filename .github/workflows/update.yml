name: update

# Runs on GitHub's servers, so the PC at home can stay off. Cron is UTC; HKT = UTC+8.
on:
  schedule:
    - cron: "45 0 * * 1-5"   # 08:45 HKT  開市前(隔晚美股已收)
    - cron: "15 2 * * 1-5"   # 10:15 HKT  開市後
    - cron: "10 4 * * 1-5"   # 12:10 HKT  午市收
    - cron: "30 6 * * 1-5"   # 14:30 HKT  下午
    - cron: "35 8 * * 1-5"   # 16:35 HKT  港股收市後(記低當日判斷,用嚟計實戰準確度)
    # 美股(美國時間 8:00-18:30 先會真係跑,所以夏令/冬令時間都啱)
    - cron: "15 13 * * 1-5"  # 21:15 HKT  美股開市前
    - cron: "0 16 * * 1-5"   # 00:00 HKT  美股盤中
    - cron: "30 18 * * 1-5"  # 02:30 HKT  美股盤中
    - cron: "40 21 * * 1-5"  # 05:40 HKT  美股收市後(記低判斷)
  workflow_dispatch:
    inputs:
      market:
        description: "hk, us, all, or auto (only the market(s) in session now)"
        default: all
      test_failure:
        description: "Fail on purpose to test the failure notice (issue + email)"
        type: boolean
        default: false

permissions:
  actions: write   # to restart the ticker if it has stopped
  contents: write
  issues: write    # failure notice: GitHub emails the repo owner about new issues

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Restart the ticker if it has stopped
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          active=$(gh run list --workflow ticker.yml --limit 5 --json status             --jq '[.[] | select(.status != "completed")] | length')
          if [ "$active" = "0" ]; then gh workflow run ticker.yml && echo "ticker restarted"; fi

      - uses: actions/checkout@v7

      - name: Fail on purpose (only when testing the failure notice)
        if: ${{ inputs.test_failure }}
        run: |
          echo "test of the failure notice requested"
          exit 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Self-check (tests must pass before anything is published)
        run: |
          pip install "pytest>=8"
          python -m pytest -q

      - name: Analyse
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONIOENCODING: utf-8
        # scheduled and ticker runs: only the market(s) in session; manual run: both unless chosen
        run: python -m hkstock --market ${{ github.event_name == 'schedule' && 'auto' || inputs.market || 'all' }}

      - name: Simulated account (fill Claude's orders at real prices)
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python -m hkstock.paper update || { echo "::warning::simulated account update failed"; exit 1; }

      - name: Restore alert state
        uses: actions/cache/restore@v6
        with:
          path: .alert_state
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - name: Holdings alerts (Telegram)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HOLDINGS: ${{ secrets.HOLDINGS }}
          PYTHONIOENCODING: utf-8
        run: python -m hkstock.alerts run

      - name: Save alert state
        if: always() && hashFiles('.alert_state/state.json') != ''
        uses: actions/cache/save@v6
        with:
          path: .alert_state
          key: alert-state-${{ github.run_id }}

      - name: Publish
        run: |
          git config user.name "hkstock-bot"
          git config user.email "hkstock-bot@users.noreply.github.com"
          git add docs/*.json data/
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: update $(TZ=Asia/Hong_Kong date '+%Y-%m-%d %H:%M') HKT"
          pushed=0
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && { pushed=1; break; }; sleep 5; done
          [ "$pushed" = 1 ] || { echo "::error::push failed 3 times"; exit 1; }

      - name: Failure notice (open or update an issue; GitHub emails the owner)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          when=$(TZ=Asia/Hong_Kong date '+%Y-%m-%d %H:%M')
          title="自動更新失敗"
          if [ "${{ inputs.test_failure }}" = "true" ]; then title="[測試] 自動更新失敗通知"; fi
          gh label create auto-update-failure --color d73a4a --description "update.yml failed" --force >/dev/null 2>&1 || true
          open=$(gh issue list --label auto-update-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$when HKT 再次失敗:$url"
          else
            gh issue create --title "$title" --label auto-update-failure --body "$when HKT 自動更新失敗,網站暫時保留上一次成功嘅數據。

          執行紀錄:$url

          系統恢復正常之後,呢個 issue 會自動關閉。"
          fi

      - name: Close the failure notice once updates work again
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          for n in $(gh issue list --label auto-update-failure --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "已恢復正常:$url"
          done
