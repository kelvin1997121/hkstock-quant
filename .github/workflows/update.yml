name: update

# Runs on GitHub's servers, so the PC at home can stay off. Cron is UTC; HKT = UTC+8.
on:
  schedule:
    - cron: "45 0 * * 1-5"   # 08:45 HKT  開市前(隔晚美股已收)
    - cron: "15 2 * * 1-5"   # 10:15 HKT  開市後
    - cron: "10 4 * * 1-5"   # 12:10 HKT  午市收
    - cron: "30 6 * * 1-5"   # 14:30 HKT  下午
    - cron: "35 8 * * 1-5"   # 16:35 HKT  收市後(記低當日判斷,用嚟計實戰準確度)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Analyse
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python -m hkstock

      - name: Publish
        run: |
          git config user.name "hkstock-bot"
          git config user.email "hkstock-bot@users.noreply.github.com"
          git add docs/data.json data/
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: update $(TZ=Asia/Hong_Kong date '+%Y-%m-%d %H:%M') HKT"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
