name: tests

# Runs the offline tests on every pull request (including Dependabot's package updates)
# and on pushes that change code, so a new package version is checked before it is merged.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "hkstock/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt "pytest>=8"

      - name: Import check (catches packages that changed their API)
        run: python -c "import hkstock.pipeline, hkstock.alerts, hkstock.ai_tools, hkstock.flows, hkstock.events; print('imports ok')"

      - name: Tests
        run: python -m pytest -q
