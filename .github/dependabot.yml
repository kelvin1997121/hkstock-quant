# Weekly check for newer Python packages and GitHub Actions. Each update arrives as a pull
# request; the "tests" workflow runs on it. Nothing is merged automatically.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    # only propose a change when a new version falls outside the allowed range (e.g. a new
    # major version), not every time the minimum could be raised
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
      day: saturday
      time: "10:00"
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "10:00"
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(actions)"
